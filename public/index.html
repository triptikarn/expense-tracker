<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <div id="userBar" class="user-bar hidden">
      <span id="userName"></span>
      <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <!-- Auth view -->
  <main id="authView" class="card auth-card">
    <h2 id="authTitle">Log in</h2>
    <form id="authForm">
      <label id="nameField" class="hidden">
        Name
        <input type="text" id="nameInput" autocomplete="name" />
      </label>
      <label>
        Email
        <input type="email" id="emailInput" required autocomplete="email" />
      </label>
      <label>
        Password
        <input type="password" id="passwordInput" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary" id="authSubmit">Log in</button>
      <p class="switch-line">
        <span id="switchText">New here?</span>
        <a href="#" id="switchMode">Create an account</a>
      </p>
      <p id="authError" class="error hidden"></p>
    </form>
  </main>

  <!-- Dashboard view -->
  <main id="dashView" class="hidden">
    <section class="stats">
      <div class="card stat"><h3>Income</h3><p id="statIncome" class="money in">—</p></div>
      <div class="card stat"><h3>Expenses</h3><p id="statExpense" class="money out">—</p></div>
      <div class="card stat"><h3>Balance</h3><p id="statBalance" class="money">—</p></div>
    </section>

    <section class="grid">
      <form id="entryForm" class="card">
        <h2>Add an entry</h2>
        <label>
          Type
          <select id="typeInput">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>
          Amount
          <input type="number" id="amountInput" min="0.01" step="0.01" required />
        </label>
        <label>
          Category
          <select id="categoryInput">
            <option>food</option>
            <option>transport</option>
            <option>housing</option>
            <option>utilities</option>
            <option>entertainment</option>
            <option>health</option>
            <option>shopping</option>
            <option>education</option>
            <option>other</option>
          </select>
        </label>
        <label>
          Note
          <input type="text" id="noteInput" maxlength="300" placeholder="Optional" />
        </label>
        <label>
          Date
          <input type="date" id="dateInput" />
        </label>
        <button type="submit" class="btn btn-primary">Add entry</button>
      </form>

      <div class="card">
        <h2>Spending by category</h2>
        <canvas id="chart" width="520" height="300"></canvas>
        <p id="chartEmpty" class="muted hidden">No expenses yet — add your first entry.</p>
      </div>
    </section>

    <section class="card">
      <h2>Recent entries</h2>
      <ul id="entryList" class="entries"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
